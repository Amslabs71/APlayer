services:
  - type: web
    name: amos-player
    runtime: node
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: amos-player-db
          property: connectionString

databases:
  - name: amos-player-db
    plan: free
    region: frankfurt
    databaseName: amosplayer
    user: amosplayer
